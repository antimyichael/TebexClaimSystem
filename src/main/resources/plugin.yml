name: TebexClaimSystem
main: org.datathorn.claimstore.TebexClaimSystemPlugin
version: ${version}
author: datathorn
commands:
  tebexclaimsystem:
    description: Open the claim GUI or add Tebex claims.
    usage: /<command> [add <username> <productName> <quantity>|addfromlist <fileName> <productName> <quantity>|reload]
    aliases: [tcs, claimstore, claims, webstoreclaim, wsc, tebexclaim, tclaim, store, storeclaim]
permissions:
  tebexclaimsystem.use:
    default: true
  tebexclaimsystem.reload:
    default: op
  tebexclaimsystem.admin:
    description: Allows administrative actions such as adding claims from a list file.
    default: op
